name: javdb-comment-links

# 每周一/三/五 03:17（北京时间）各跑一次；也可手动触发。
# 为避免账号被风控：每轮只处理 MAX_CODES 个番号、请求间隔 3.5s；靠增量 state 分多轮补齐全部番号。
# 数据来源：仓库里的 movie_codes.json（番号清单，由本机 gen_movie_codes.py 生成后提交）
# 原因：GitHub 海外 runner 连不上 139 移动云盘，所以列目录只在能做的地方做，这里只爬 JavDB + 发通知
on:
  schedule:
    - cron: '17 19 * * 0,2,4'   # UTC 周日/二/四 19:17 = 北京周一/三/五 03:17
  workflow_dispatch:
    inputs:
      cutoff:
        description: '起始日期 YYYY-MM-DD'
        default: '2026-09-01'
      max_codes:
        description: '本轮最多处理多少番号（0=全部）'
        default: '40'

permissions:
  contents: write

concurrency:
  group: javdb-comment-links
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      JAVDB_USERNAME: ${{ secrets.JAVDB_USERNAME }}
      JAVDB_PASSWORD: ${{ secrets.JAVDB_PASSWORD }}
      MOVIE_CODES_FILE: movie_codes.json
      CUTOFF: ${{ github.event.inputs.cutoff || '2026-09-01' }}
      OUT_PREFIX: javdb_yiyuan
      SLEEP_REQ: '3.5'
      MAX_CODES: ${{ github.event.inputs.max_codes || '40' }}
      MAX_REVIEW_PAGES: '3'
      STATE_FILE: state_javdb.json
      SKIP_FC2: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run crawler (JavDB only, codes from movie_codes.json)
        run: |
          python tools/crawler.py

      - name: Send report to Telegram (only if crawler succeeded)
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          JAVDB_OUT_DIR: .
        run: |
          python tools/tg_javdb_report.py --send

      - name: Notify failure to Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          tok=os.environ.get('TG_TOKEN',''); chat=os.environ.get('TG_CHAT_ID','')
          if tok and chat:
              t='⚠️ JavDB 抓取任务本轮失败（crawler 步骤报错），未生成新报告。请查 Actions 日志。'
              d=urllib.parse.urlencode({'chat_id':chat,'text':t}).encode()
              urllib.request.urlopen(urllib.request.Request('https://api.telegram.org/bot%s/sendMessage'%tok,data=d),timeout=30)
          PY

      - name: Commit results & state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f javdb_yiyuan_magnet_ed2k_*.csv javdb_yiyuan_links_*.txt state_javdb.json || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update javdb comment links $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javdb-comment-links
          path: |
            javdb_yiyuan_*.csv
            javdb_yiyuan_*.txt
          if-no-files-found: warn
