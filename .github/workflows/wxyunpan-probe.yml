name: wxyunpan-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe api.xbapi.com reachability from runner
        run: |
          python3 - <<'PY'
          import urllib.request, socket, ssl
          for host in ['api.xbapi.com','www.googleapis.com','oauth2.googleapis.com']:
              try:
                  ip=socket.gethostbyname(host); print(host,'DNS ->',ip)
              except Exception as e:
                  print(host,'DNS FAIL',str(e)[:80])
          for url in ['https://api.xbapi.com/v1/app/m/user/login','https://www.googleapis.com/drive/v3/about?fields=user']:
              try:
                  req=urllib.request.Request(url, data=b'{}', headers={'User-Agent':'probe','Content-Type':'application/json'}, method='POST')
                  r=urllib.request.urlopen(req, timeout=20)
                  print(url,'->',r.status, r.read()[:120])
              except urllib.error.HTTPError as e:
                  print(url,'HTTP',e.code,e.read()[:160])
              except Exception as e:
                  print(url,'ERR',repr(e)[:160])
          PY
